<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINA | Sign Up</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="login-page-body">


    <div class="login-wrapper signup-wrapper">
        <div class="login-card">
            <div class="login-header">
                <a href="index.html" class="brand-logo">
                    <div class="logo-icon"><i class="fas fa-film"></i></div>
                    LUMINA<span>.</span>
                </a>
                <p>Join the collective</p>
            </div>

            <form action="#">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="new-password" class="form-control" placeholder="••••••••" required>
                        <i class="fas fa-eye toggle-password" data-target="new-password"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirm-password" class="form-control" placeholder="••••••••"
                            required>
                        <i class="fas fa-eye toggle-password" data-target="confirm-password"></i>
                    </div>
                </div>

                <div class="form-check">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">I agree to <a href="#">Terms & Conditions</a></label>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Sign Up</button>
            </form>

            <div class="divider">or continue with</div>

            <div class="social-login">
                <button class="btn-social">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google"
                        style="width: 20px; height: 20px;">
                    Google
                </button>
                <button class="btn-social">
                    <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook"
                        style="width: 20px; height: 20px;">
                    Facebook
                </button>
            </div>

            <div class="back-link">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        // Universal Password Toggle Functionality
        const toggles = document.querySelectorAll('.toggle-password');

        toggles.forEach(toggle => {
            toggle.addEventListener('click', function () {
                const targetId = this.getAttribute('data-target');
                const passwordInput = document.getElementById(targetId);

                if (passwordInput) {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);

                    this.classList.toggle('fa-eye');
                    this.classList.toggle('fa-eye-slash');
                }
            });
        });
    </script>
</body>

</html>
